services:
  postgres:
    image: postgres:16-alpine
    container_name: passbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: passbuddy
      POSTGRES_USER: passbuddy_admin
      POSTGRES_PASSWORD: passbuddy_admin_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - passbuddy_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passbuddy_admin -d passbuddy"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  passbuddy_postgres_data:
